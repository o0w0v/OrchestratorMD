<title id="title">3. 業務20件：Sol一括実行と、Luna整理＋Gemmaを比較</title>
<desc id="desc">比べたもの：Solの理解・計画・実作業を、Lunaの整理とGemmaの実作業へ置き換える。 共通の前提：同じ完全な業務情報・成果物の形式・Host検査・採点方法を事前固定。 ③④は同じ20課題、②とは別課題。この図はSolが1件ずつ確認した結果。 Lunaの2業務は2工程で成功したが、分割単独の効果は未分離。対象外1件は能力不足の実証ではない。 新100件の最大2件まとめ確認とは別。対話での明確化・検査準備の全費用は未測定。</desc>
