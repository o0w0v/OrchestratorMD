<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Gemmaへの再依頼に伴ってSol費用が増える場合</title>
<desc id="desc">説明用の構成。固定指示からGemmaが生成し、HostとSolが確認する。不合格のたびにSolで原因整理と再指示を行う場合、Sol呼出し分のCreditsが積み重なる。GemmaとHostだけの再試行なら追加Codex Creditsは0だがLocal時間と電力はかかる。図①の実測はone-shot、repair0であり、この再依頼ループの実測ではない。増加率は未測定。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#536577"/></marker>
<marker id="fallback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#b94539"/></marker>
<marker id="accept" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#2d8651"/></marker>
<marker id="retry" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#3565b5"/></marker>
</defs>
<rect width="1440" height="1080" fill="white"/>
<g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#1e3045">
<text x="40" y="55" font-size="30" font-weight="700" text-anchor="start" fill="#1e3045">再依頼を重ねると、周辺のSol費用も増えることがある</text>
<text x="40" y="94" font-size="21" font-weight="400" text-anchor="start" fill="#1e3045">Gemmaの呼出し自体ではなく、Solによる原因整理・再指示・再確認を繰り返す場合の説明図。</text>
<rect x="40" y="119" width="190" height="32" rx="16" fill="#eaf1ff" stroke="none" stroke-width="2"/>
<text x="54" y="142" font-size="17" font-weight="400" text-anchor="start" fill="#3565b5">Sol：Creditsを消費</text>
<rect x="250" y="119" width="170" height="32" rx="16" fill="#fff1dc" stroke="none" stroke-width="2"/>
<text x="264" y="142" font-size="17" font-weight="400" text-anchor="start" fill="#b87416">Gemma：Local</text>
<rect x="440" y="119" width="195" height="32" rx="16" fill="#f0f3f6" stroke="none" stroke-width="2"/>
<text x="454" y="142" font-size="17" font-weight="400" text-anchor="start" fill="#607183">固定プログラム</text>
<rect x="655" y="119" width="300" height="32" rx="16" fill="#fff0ee" stroke="none" stroke-width="2"/>
<text x="669" y="142" font-size="17" font-weight="400" text-anchor="start" fill="#b94539">赤破線：不合格／青矢印：再依頼</text>
<rect x="40" y="180" width="460" height="660" rx="18" fill="#fffaf0" stroke="#ddbd70" stroke-width="2"/>
<text x="60" y="220" font-size="23" font-weight="700" text-anchor="start" fill="#936820">前提：タスクが明確な依頼</text>
<text x="60" y="254" font-size="18" font-weight="400" text-anchor="start" fill="#76603c">仕様・編集範囲・テストを先に用意</text>
<rect x="520" y="180" width="904" height="660" rx="18" fill="#f5f8ff" stroke="#7094c9" stroke-width="2"/>
<text x="545" y="220" font-size="24" font-weight="700" text-anchor="start" fill="#3565b5">説明用：再依頼にSolを使う構成</text>
<text x="545" y="254" font-size="20" font-weight="700" text-anchor="start" fill="#1e3045">不合格のたびに、Solで原因整理・再指示・再確認</text>
<text x="545" y="285" font-size="17" font-weight="400" text-anchor="start" fill="#536577">注：図①の実測はGemma1回・修正0。このループを測った結果ではない。</text>
<rect x="55" y="335" width="175" height="185" rx="14" fill="#f0f3f6" stroke="#607183" stroke-width="2"/>
<text x="142.5" y="369" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">人間の依頼</text>
<text x="142.5" y="403" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">仕様どおりに</text>
<text x="142.5" y="437" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">Rustを修正</text>
<rect x="270" y="335" width="215" height="185" rx="14" fill="#f0f3f6" stroke="#607183" stroke-width="2"/>
<text x="377.5" y="369" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">固定した条件</text>
<text x="377.5" y="403" font-size="19" font-weight="700" text-anchor="middle" fill="#1e3045">対象・変更範囲</text>
<text x="377.5" y="437" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">テスト・禁止事項</text>
<rect x="550" y="335" width="235" height="185" rx="14" fill="#f0f3f6" stroke="#607183" stroke-width="2"/>
<text x="667.5" y="369" font-size="21" font-weight="700" text-anchor="middle" fill="#1e3045">固定した作業指示</text>
<text x="667.5" y="403" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">仕様・範囲・テスト</text>
<text x="667.5" y="437" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">Gemmaへ渡す</text>
<rect x="850" y="335" width="235" height="185" rx="14" fill="#fff1dc" stroke="#b87416" stroke-width="2"/>
<text x="967.5" y="369" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">Gemma4 26B</text>
<text x="967.5" y="403" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">1回目／再依頼</text>
<text x="967.5" y="437" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">生成・修正を実行</text>
<rect x="851" y="455" width="233" height="64" rx="11" fill="#f0f3f6" stroke="none" stroke-width="2"/>
<text x="967.5" y="480" font-size="16" font-weight="400" text-anchor="middle" fill="#536577">Host：範囲・構文・テスト</text>
<text x="967.5" y="505" font-size="16" font-weight="400" text-anchor="middle" fill="#536577">固定した検査を実行</text>
<rect x="1150" y="335" width="225" height="185" rx="14" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="1262.5" y="369" font-size="21" font-weight="700" text-anchor="middle" fill="#1e3045">Solが内容を確認</text>
<text x="1262.5" y="403" font-size="19" font-weight="700" text-anchor="middle" fill="#1e3045">再確認にもCredits</text>
<text x="1262.5" y="437" font-size="17" font-weight="400" text-anchor="middle" fill="#1e3045">候補と元資料を読み</text>
<text x="1262.5" y="471" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">採否を判断する</text>
<path d="M230,405 H264" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M485,405 H544" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M785,405 H844" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1085,486 H1117 V405 H1144" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="62" y="582" font-size="21" font-weight="700" text-anchor="start" fill="#1e3045">Codex Creditsが増えるのは？</text>
<text x="62" y="618" font-size="18" font-weight="400" text-anchor="start" fill="#536577">Solを追加で呼び出したとき。</text>
<text x="62" y="647" font-size="18" font-weight="400" text-anchor="start" fill="#536577"></text>
<text x="62" y="676" font-size="18" font-weight="400" text-anchor="start" fill="#536577">GemmaのLocal生成と</text>
<text x="62" y="705" font-size="18" font-weight="400" text-anchor="start" fill="#536577">Hostの固定検査だけなら</text>
<text x="62" y="734" font-size="18" font-weight="400" text-anchor="start" fill="#536577">追加のCodex Creditsは0。</text>
<text x="62" y="763" font-size="18" font-weight="400" text-anchor="start" fill="#536577">時間・電力・機器費は別にかかる。</text>
<path d="M1262,520 V547" fill="none" stroke="#2d8651" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#accept)"/>
<rect x="1150" y="555" width="225" height="51" rx="12" fill="#e9f7ed" stroke="#2d8651" stroke-width="2"/>
<text x="1262" y="587" font-size="22" font-weight="700" text-anchor="middle" fill="#2d8651">採用 → 成果物</text>
<path d="M1085,500 H1125 V650 H910 V683" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#fallback)"/>
<path d="M1375,486 H1393 V650 H1125" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
<text x="952" y="632" font-size="17" font-weight="700" text-anchor="start" fill="#b94539">Host検査NG</text>
<text x="1210" y="632" font-size="17" font-weight="700" text-anchor="start" fill="#b94539">Solが不採用</text>
<rect x="760" y="690" width="300" height="105" rx="14" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="910" y="723" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">Solが原因整理・再指示</text>
<text x="910" y="754" font-size="17" font-weight="400" text-anchor="middle" fill="#1e3045">直し方を考えてGemmaへ戻す</text>
<text x="910" y="782" font-size="18" font-weight="700" text-anchor="middle" fill="#3565b5">ここで呼ぶ分もCredits</text>
<path d="M760,742 H715 V570 H905 V525" fill="none" stroke="#3565b5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#retry)"/>
<text x="721" y="610" font-size="18" font-weight="700" text-anchor="start" fill="#3565b5">再依頼</text>
<path d="M1060,742 H1104" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1085" y="678" font-size="16" font-weight="400" text-anchor="middle" fill="#536577">打ち切る場合</text>
<rect x="1110" y="690" width="265" height="105" rx="14" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="1242" y="723" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">Solで実装し直す</text>
<text x="1242" y="754" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">元資料から実作業＋独立確認</text>
<text x="1242" y="782" font-size="18" font-weight="700" text-anchor="middle" fill="#3565b5">この費用もさらに加わる</text>
<text x="545" y="824" font-size="16" font-weight="400" text-anchor="start" fill="#536577">ループ回数は説明用。元の1回実行・clean fallbackの実験条件は変更しない。</text>
<rect x="40" y="868" width="1384" height="157" rx="14" fill="#f5f8fc" stroke="none" stroke-width="2"/>
<text x="60" y="901" font-size="21" font-weight="700" text-anchor="start" fill="#3565b5">積み重なる費用</text>
<text x="280" y="901" font-size="19" font-weight="400" text-anchor="start" fill="#1e3045">実際に呼んだSolの原因整理・再指示・レビュー。最後に戻せば実作業と確認も追加。</text>
<text x="60" y="943" font-size="21" font-weight="700" text-anchor="start" fill="#936820">Localだけの再試行</text>
<text x="280" y="943" font-size="20" font-weight="400" text-anchor="start" fill="#1e3045">追加Codex Creditsは0。Localの実行時間・電力等のコストは増える。</text>
<text x="60" y="989" font-size="20" font-weight="700" text-anchor="start" fill="#536577">読み取りの注意</text>
<text x="280" y="989" font-size="19" font-weight="400" text-anchor="start" fill="#1e3045">Solを追加で呼ぶ場合の説明図。増加率や「何回で損か」を測った結果ではない。</text>
<text x="40" y="1055" font-size="20" font-weight="700" text-anchor="start" fill="#1e3045">節約を判断するのは、Gemma単体ではなく、検査・確認・失敗処理を含む全体の費用。  説明図：2026-10-30</text>
</g></svg>
