<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
<title id="title">1. 仕様が明確な作業：Sol → Gemma4 26B → Sol</title>
<desc id="desc">小さなRust実装・修正。変更箇所と合格条件を先に固定する。 不合格は元資料からのSol実行へ引き継ぎ、再検査する。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#536577"/></marker><marker id="fallback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#b94539"/></marker><marker id="accept" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#2d8651"/></marker></defs>
<rect width="1440" height="880" fill="white"/>
<g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#1e3045">
<text x="50" y="57" font-size="32" font-weight="700" text-anchor="start" fill="#1e3045">1. 仕様が明確な作業：Sol → Gemma4 26B → Sol</text>
<text x="50" y="98" font-size="21" font-weight="400" text-anchor="start" fill="#1e3045">小さなRust実装・修正。変更箇所と合格条件を先に固定する。</text>
<rect x="50" y="122" width="150" height="34" rx="17" fill="#eaf1ff"/>
<text x="65" y="146" font-size="17" font-weight="400" text-anchor="start" fill="#3565b5">クラウド</text>
<rect x="230" y="122" width="150" height="34" rx="17" fill="#fff1dc"/>
<text x="245" y="146" font-size="17" font-weight="400" text-anchor="start" fill="#b87416">Local</text>
<rect x="390" y="122" width="150" height="34" rx="17" fill="#f0f3f6"/>
<text x="405" y="146" font-size="17" font-weight="400" text-anchor="start" fill="#607183">Host検査</text>
<rect x="585" y="122" width="250" height="34" rx="17" fill="#fff0ee"/>
<text x="600" y="146" font-size="17" font-weight="400" text-anchor="start" fill="#b94539">破線：Solへ引継ぎ</text>
<text x="50" y="197" font-size="21" font-weight="700" text-anchor="start" fill="#1e3045">入力：仕様・修正箇所・受入条件が明確な小さな依頼</text>
<rect x="50" y="240" width="230" height="118" rx="15" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="165.0" y="285" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">GPT-6 Sol</text>
<text x="165.0" y="320" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">範囲と合格条件を確定</text>
<rect x="345" y="240" width="230" height="118" rx="15" fill="#fff1dc" stroke="#b87416" stroke-width="2"/>
<text x="460.0" y="285" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">Gemma4 26B</text>
<text x="460.0" y="320" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">固定した範囲を1回実装</text>
<rect x="640" y="240" width="230" height="118" rx="15" fill="#f0f3f6" stroke="#607183" stroke-width="2"/>
<text x="755.0" y="285" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">Hostの検査</text>
<text x="755.0" y="320" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">範囲・構文・テスト</text>
<rect x="935" y="240" width="230" height="118" rx="15" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="1050.0" y="285" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">GPT-6 Sol</text>
<text x="1050.0" y="320" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">別sessionでレビュー</text>
<rect x="1230" y="240" width="160" height="118" rx="15" fill="#e9f7ed" stroke="#2d8651" stroke-width="2"/>
<text x="1310.0" y="285" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">採用</text>
<text x="1310.0" y="320" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">変更なしで使う</text>
<path d="M280,299 H340" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="312.5" y="281" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">指示</text>
<path d="M575,299 H635" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="607.5" y="281" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">候補</text>
<path d="M870,299 H930" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="902.5" y="281" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">PASS</text>
<path d="M1165,299 H1225" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1197.5" y="281" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">採用可</text>
<path d="M165,358 V555 H510" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#fallback)"/>
<text x="177" y="534" font-size="18" font-weight="700" text-anchor="start" fill="#b94539">Local対象外</text>
<path d="M755,358 V415 H660 V490" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#fallback)"/>
<text x="605" y="400" font-size="18" font-weight="700" text-anchor="start" fill="#b94539">検査不合格</text>
<path d="M1050,358 V455 H780 V490" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#fallback)"/>
<text x="924" y="438" font-size="18" font-weight="700" text-anchor="start" fill="#b94539">レビュー拒否</text>
<rect x="515" y="495" width="290" height="120" rx="15" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="660.0" y="540" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">Solで実作業</text>
<text x="660.0" y="575" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">元資料からやり直す</text>
<rect x="915" y="495" width="290" height="120" rx="15" fill="#f0f3f6" stroke="#607183" stroke-width="2"/>
<text x="1060.0" y="540" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">Host＋別Sol</text>
<text x="1060.0" y="575" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">再検査・独立レビュー</text>
<rect x="1230" y="495" width="160" height="120" rx="15" fill="#fff0ee" stroke="#b94539" stroke-width="2"/>
<text x="1310.0" y="540" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">不合格</text>
<text x="1310.0" y="575" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">結果を記録</text>
<path d="M805,555 H910" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="860" y="536" font-size="17" font-weight="400" text-anchor="middle" fill="#1e3045">別実行</text>
<path d="M1205,555 H1225" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#fallback)"/>
<text x="1285" y="476" font-size="16" font-weight="400" text-anchor="middle" fill="#b94539">再確認も不合格</text>
<path d="M1060,495 V390 H1310 V363" fill="none" stroke="#2d8651" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#accept)"/>
<text x="1260" y="383" font-size="16" font-weight="400" text-anchor="middle" fill="#2d8651">再確認に合格</text>
<rect x="50" y="662" width="1340" height="143" rx="14" fill="#f5f8fc"/>
<text x="73" y="698" font-size="23" font-weight="700" text-anchor="start" fill="#1e3045">過去の内部44課題：品質確認できた同じ課題で比較</text>
<text x="73" y="735" font-size="20" font-weight="400" text-anchor="start" fill="#1e3045">Sol単体 40/44 → Sol＋Gemma 44/44 ／ Credits 約41%減</text>
<text x="73" y="772" font-size="20" font-weight="400" text-anchor="start" fill="#1e3045">46課題中、併用経路の2課題は品質未測定。公式ベンチマークの結果ではない。</text>
<text x="50" y="846" font-size="17" font-weight="400" text-anchor="start" fill="#536577">役割を示す図。旧内部実測では共有Planner出力をGemma promptへ直接注入していない。</text>
</g></svg>
