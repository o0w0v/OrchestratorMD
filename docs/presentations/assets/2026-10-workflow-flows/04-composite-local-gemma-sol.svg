<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">4. 条件補足済みの業務：Local整理 → Gemma → Sol確認</title>
<desc id="desc">Local Plannerはgpt-oss 20B / medium。Solは計画・答案の通常の手直し役ではない。 事前固定：成果物のJSON形式・Host検査・採点用期待値。両方式に同じ完全な補足を提供。 整理AIは手順・担当範囲・渡す資料を決める。出力形式やHost検査を実行中に作っていない。 計画の形式が正しくても、各工程へ必要な情報が届く保証はない。Solにも見落としはあり得る。 検査の準備・保守の全費用は実行Creditsに含めていない。Local全般の結論ではない。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#536577"/></marker>
<marker id="fallback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#b94539"/></marker>
<marker id="accept" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#2d8651"/></marker>
</defs>
<rect width="1440" height="1080" fill="white"/>
<g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#1e3045">
<text x="40" y="53" font-size="30" font-weight="700" text-anchor="start" fill="#1e3045">4. 条件補足済みの業務：Local整理 → Gemma → Sol確認</text>
<text x="40" y="91" font-size="20" font-weight="400" text-anchor="start" fill="#1e3045">Local Plannerはgpt-oss 20B / medium。Solは計画・答案の通常の手直し役ではない。</text>
<rect x="40" y="112" width="150" height="32" rx="16" fill="#eaf1ff"/>
<text x="54" y="135" font-size="17" font-weight="400" text-anchor="start" fill="#3565b5">クラウド</text>
<rect x="210" y="112" width="130" height="32" rx="16" fill="#fff1dc"/>
<text x="224" y="135" font-size="17" font-weight="400" text-anchor="start" fill="#b87416">Local</text>
<rect x="360" y="112" width="250" height="32" rx="16" fill="#f0f3f6"/>
<text x="374" y="135" font-size="17" font-weight="400" text-anchor="start" fill="#607183">固定準備・Host検査</text>
<rect x="630" y="112" width="280" height="32" rx="16" fill="#fff0ee"/>
<text x="644" y="135" font-size="17" font-weight="400" text-anchor="start" fill="#b94539">破線：別のSol実行へ</text>
<rect x="40" y="165" width="1360" height="90" rx="13" fill="#fff9e9" stroke="#dbbf72"/>
<text x="58" y="197" font-size="19" font-weight="700" text-anchor="start" fill="#1e3045">事前固定：成果物のJSON形式・Host検査・採点用期待値。両方式に同じ完全な補足を提供。</text>
<text x="58" y="229" font-size="19" font-weight="400" text-anchor="start" fill="#1e3045">整理AIは手順・担当範囲・渡す資料を決める。出力形式やHost検査を実行中に作っていない。</text>
<rect x="40" y="300" width="185" height="120" rx="14" fill="#fff1dc" stroke="#b87416" stroke-width="2"/>
<text x="132.5" y="341.5" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">gpt-oss 20B</text>
<text x="132.5" y="372.5" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">mediumで整理</text>
<rect x="270" y="300" width="185" height="120" rx="14" fill="#f0f3f6" stroke="#607183" stroke-width="2"/>
<text x="362.5" y="341.5" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">Host計画検査</text>
<text x="362.5" y="372.5" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">参照・範囲・依存</text>
<rect x="500" y="300" width="185" height="120" rx="14" fill="#fff1dc" stroke="#b87416" stroke-width="2"/>
<text x="592.5" y="341.5" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">Gemma4 26B</text>
<text x="592.5" y="372.5" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">14件実行・13件採用</text>
<rect x="730" y="300" width="185" height="120" rx="14" fill="#f0f3f6" stroke="#607183" stroke-width="2"/>
<text x="822.5" y="341.5" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">Host出力検査</text>
<text x="822.5" y="372.5" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">形式・保護箇所</text>
<rect x="960" y="300" width="185" height="120" rx="14" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="1052.5" y="341.5" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">GPT-6.1 Sol</text>
<text x="1052.5" y="372.5" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">1件ずつ内容確認</text>
