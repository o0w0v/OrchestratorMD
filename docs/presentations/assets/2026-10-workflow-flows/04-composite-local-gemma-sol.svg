<text x="1295.0" y="341.5" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">採用</text>
<text x="1295.0" y="372.5" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">変更なしで使う</text>
