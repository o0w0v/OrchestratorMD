<path d="M455,360 H495" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M685,360 H725" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M915,360 H955" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1145,360 H1185" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M132,420 V530" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
<text x="145" y="448" font-size="16" font-weight="700" text-anchor="start" fill="#b94539">対象外（AI判断）</text>
<path d="M362,420 V530" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
<text x="375" y="485" font-size="16" font-weight="700" text-anchor="start" fill="#b94539">計画不備（Host）</text>
<path d="M822,420 V530" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
<text x="835" y="448" font-size="16" font-weight="700" text-anchor="start" fill="#b94539">生成・検査NG</text>
<path d="M1052,420 V530" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
<text x="1065" y="485" font-size="16" font-weight="700" text-anchor="start" fill="#b94539">REJECT</text>
<path d="M132,530 H1052" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
<path d="M640,530 V585" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#fallback)"/>
<text x="40" y="742" font-size="18" font-weight="700" text-anchor="start" fill="#536577">実測：Hostが計画不備6件を検出しSolへ。Local実行後の1件もSolへfallback。</text>
<rect x="500" y="590" width="280" height="125" rx="14" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="640.0" y="634.0" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">Solで実作業</text>
<text x="640.0" y="665.0" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">元資料から別session実行</text>
<rect x="900" y="590" width="280" height="125" rx="14" fill="#f0f3f6" stroke="#607183" stroke-width="2"/>
<text x="1040.0" y="634.0" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">Host＋独立Sol</text>
<text x="1040.0" y="665.0" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">再検査・レビュー</text>
<rect x="1230" y="590" width="170" height="125" rx="14" fill="#fff0ee" stroke="#b94539" stroke-width="2"/>
<text x="1315.0" y="634.0" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">不合格</text>
<text x="1315.0" y="665.0" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">結果を記録</text>
<path d="M780,652 H895" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1180,652 H1225" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#fallback)"/>
<text x="1205" y="633" font-size="16" font-weight="400" text-anchor="middle" fill="#b94539">不合格</text>
<path d="M1040,590 V560 H1295 V425" fill="none" stroke="#2d8651" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#accept)"/>
<text x="1195" y="548" font-size="16" font-weight="400" text-anchor="start" fill="#2d8651">合格</text>
<rect x="40" y="780" width="1360" height="145" rx="14" fill="#f5f8fc"/>
<text x="62" y="817" font-size="21" font-weight="700" text-anchor="start" fill="#1e3045">③と同じ20件：両方式20/20正解 ／ Credits 31.38868 → 18.38004（41.4%減）</text>
<text x="62" y="854" font-size="19" font-weight="400" text-anchor="start" fill="#1e3045">平均active時間 23.9 → 149.2秒。Sol直行6件＋Local実行後fallback1件を含む。</text>
<text x="62" y="891" font-size="19" font-weight="400" text-anchor="start" fill="#1e3045">todayの渡し忘れは旧Host計画検査では止まらず、Solが出力を拒否して別実行した。</text>
<text x="40" y="970" font-size="18" font-weight="400" text-anchor="start" fill="#536577">計画の形式が正しくても、各工程へ必要な情報が届く保証はない。Solにも見落としはあり得る。</text>
<text x="40" y="1001" font-size="18" font-weight="400" text-anchor="start" fill="#536577">検査の準備・保守の全費用は実行Creditsに含めていない。Local全般の結論ではない。</text>
<text x="40" y="1052" font-size="16" font-weight="400" text-anchor="start" fill="#536577">内部の保存済み実測を説明する図。旧raw・採点は不変。実行Creditsは準備込み総費用ではない。</text>
</g></svg>
