<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">目指す全体像と、現在の実験範囲</title>
<desc id="desc">人間の曖昧な依頼をクラウドAIが明確化し、仕事を分担してLocal LLMへ委任し、独立したクラウドAIが確認する目標。現在の主な比較は、条件・出力形式・Host検査を事前に準備した後の分担、Local実行、確認と引き継ぎ。人間への確認を通じた明確化と、検査準備を含む全体の費用削減は未測定。Local対象外や失敗した仕事はクラウドAIへ引き継ぐ。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#536577"/></marker>
<marker id="fallback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#b94539"/></marker>
<marker id="accept" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#2d8651"/></marker>
<marker id="ask" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a77923"/></marker>
</defs>
<rect width="1440" height="1080" fill="white"/>
<g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif" fill="#1e3045">
<text x="40" y="55" font-size="32" font-weight="700" text-anchor="start" fill="#1e3045">目指す全体像と、現在の実験範囲</text>
<text x="40" y="94" font-size="21" font-weight="400" text-anchor="start" fill="#1e3045">クラウドが明確化・分担・確認を担い、Localができる仕事を実行する。できない仕事はクラウドへ。</text>
<rect x="40" y="119" width="165" height="32" rx="16" fill="#eaf1ff" stroke="none" stroke-width="2"/>
<text x="54" y="142" font-size="17" font-weight="400" text-anchor="start" fill="#3565b5">クラウドAI</text>
<rect x="225" y="119" width="140" height="32" rx="16" fill="#fff1dc" stroke="none" stroke-width="2"/>
<text x="239" y="142" font-size="17" font-weight="400" text-anchor="start" fill="#b87416">Local LLM</text>
<rect x="385" y="119" width="195" height="32" rx="16" fill="#f0f3f6" stroke="none" stroke-width="2"/>
<text x="399" y="142" font-size="17" font-weight="400" text-anchor="start" fill="#607183">固定プログラム</text>
<rect x="600" y="119" width="265" height="32" rx="16" fill="#fff0ee" stroke="none" stroke-width="2"/>
<text x="614" y="142" font-size="17" font-weight="400" text-anchor="start" fill="#b94539">破線：クラウドへ引継ぎ</text>
<rect x="40" y="180" width="460" height="660" rx="18" fill="#fffaf0" stroke="#ddbd70" stroke-width="2"/>
<text x="60" y="220" font-size="23" font-weight="700" text-anchor="start" fill="#936820">今後の検証：曖昧な依頼の明確化</text>
<text x="60" y="254" font-size="16" font-weight="400" text-anchor="start" fill="#76603c">必要な条件を対話でそろえる能力・全費用は未測定</text>
<rect x="520" y="180" width="904" height="660" rx="18" fill="#f5f8ff" stroke="#7094c9" stroke-width="2"/>
<text x="545" y="220" font-size="24" font-weight="700" text-anchor="start" fill="#3565b5">現在の主な比較対象</text>
<text x="545" y="254" font-size="20" font-weight="700" text-anchor="start" fill="#1e3045">業務ルール・出力形式・Host検査を、試験側が事前に用意</text>
<text x="545" y="285" font-size="18" font-weight="400" text-anchor="start" fill="#536577">分担 → Local実行 → 確認・引き継ぎの品質・時間・Creditsを比較</text>
<rect x="55" y="335" width="175" height="185" rx="14" fill="#f5f2eb" stroke="#a88d5e" stroke-width="2"/>
<text x="142.5" y="369" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">人間の依頼</text>
<text x="142.5" y="403" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">「10月の売上を</text>
<text x="142.5" y="437" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">まとめて」</text>
<rect x="270" y="335" width="215" height="185" rx="14" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="377.5" y="369" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">クラウドAI</text>
<text x="377.5" y="403" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">タスクの明確化</text>
<text x="377.5" y="437" font-size="17" font-weight="400" text-anchor="middle" fill="#1e3045">目的・条件・成果物を</text>
<text x="377.5" y="471" font-size="17" font-weight="400" text-anchor="middle" fill="#1e3045">人間と合意する</text>
<rect x="550" y="335" width="235" height="185" rx="14" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="667.5" y="369" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">クラウドAI</text>
<text x="667.5" y="403" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">分担・必要な分解</text>
<text x="667.5" y="437" font-size="17" font-weight="400" text-anchor="middle" fill="#1e3045">手順・入力・担当を決定</text>
<rect x="551" y="455" width="233" height="64" rx="11" fill="#f0f3f6" stroke="none" stroke-width="2"/>
<text x="667.5" y="480" font-size="16" font-weight="400" text-anchor="middle" fill="#536577">Host：計画を検査</text>
<text x="667.5" y="505" font-size="16" font-weight="400" text-anchor="middle" fill="#536577">形式・参照など</text>
<rect x="850" y="335" width="235" height="185" rx="14" fill="#fff1dc" stroke="#b87416" stroke-width="2"/>
<text x="967.5" y="369" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">Local LLM</text>
<text x="967.5" y="403" font-size="20" font-weight="700" text-anchor="middle" fill="#1e3045">Gemma4 26Bなど</text>
<text x="967.5" y="437" font-size="17" font-weight="400" text-anchor="middle" fill="#1e3045">委任された作業を実行</text>
<rect x="851" y="455" width="233" height="64" rx="11" fill="#f0f3f6" stroke="none" stroke-width="2"/>
<text x="967.5" y="480" font-size="16" font-weight="400" text-anchor="middle" fill="#536577">Host：出力を検査</text>
<text x="967.5" y="505" font-size="16" font-weight="400" text-anchor="middle" fill="#536577">形式・範囲など</text>
<rect x="1150" y="335" width="225" height="185" rx="14" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="1262.5" y="369" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">クラウドAI</text>
<text x="1262.5" y="403" font-size="19" font-weight="700" text-anchor="middle" fill="#1e3045">独立したSolが確認</text>
<text x="1262.5" y="437" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">元の依頼・資料に照らし</text>
<text x="1262.5" y="471" font-size="17" font-weight="400" text-anchor="middle" fill="#1e3045">内容の採否を判断</text>
<path d="M230,405 H264" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M485,405 H544" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M785,486 H817 V405 H844" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1085,486 H1117 V405 H1144" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M377,335 V302 H142 V329" fill="none" stroke="#a77923" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#ask)"/>
<text x="257" y="319" font-size="15" font-weight="400" text-anchor="middle" fill="#936820">不足があれば人間に確認</text>
<text x="62" y="582" font-size="21" font-weight="700" text-anchor="start" fill="#1e3045">明確化と、分解は別の作業</text>
<text x="62" y="618" font-size="18" font-weight="400" text-anchor="start" fill="#536577">明確化：何を作るかを決める</text>
<text x="62" y="647" font-size="18" font-weight="400" text-anchor="start" fill="#536577">分解・分担：手順と担当を決める</text>
<text x="62" y="676" font-size="18" font-weight="400" text-anchor="start" fill="#536577"></text>
<text x="62" y="705" font-size="18" font-weight="400" text-anchor="start" fill="#536577">例：対象月、キャンセルの扱い、</text>
<text x="62" y="734" font-size="18" font-weight="400" text-anchor="start" fill="#536577">集計単位、出力形式を人間に確認。</text>
<text x="62" y="763" font-size="18" font-weight="400" text-anchor="start" fill="#536577">業務ルールをAIが勝手に決めない。</text>
<path d="M1262,520 V547" fill="none" stroke="#2d8651" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#accept)"/>
<rect x="1150" y="555" width="225" height="51" rx="12" fill="#e9f7ed" stroke="#2d8651" stroke-width="2"/>
<text x="1262" y="587" font-size="22" font-weight="700" text-anchor="middle" fill="#2d8651">採用 → 成果物</text>
<path d="M667,520 V650" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
<path d="M967,520 V650" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
<path d="M1375,486 H1393 V650" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
<path d="M667,650 H1393" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
<path d="M910,650 V683" fill="none" stroke="#b94539" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#fallback)"/>
<text x="560" y="632" font-size="17" font-weight="700" text-anchor="start" fill="#b94539">対象外・計画不備</text>
<text x="858" y="632" font-size="17" font-weight="700" text-anchor="start" fill="#b94539">生成・Host検査NG</text>
<text x="1210" y="632" font-size="17" font-weight="700" text-anchor="start" fill="#b94539">レビュー不採用</text>
<rect x="760" y="690" width="300" height="105" rx="14" fill="#eaf1ff" stroke="#3565b5" stroke-width="2"/>
<text x="910" y="723" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">クラウドAIが実作業</text>
<text x="910" y="754" font-size="17" font-weight="400" text-anchor="middle" fill="#1e3045">元資料から別sessionで実行</text>
<text x="910" y="782" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3045">Localが担当できない仕事を引継ぎ</text>
<path d="M1060,742 H1104" fill="none" stroke="#536577" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1110" y="690" width="265" height="105" rx="14" fill="#f0f3f6" stroke="#607183" stroke-width="2"/>
<text x="1242" y="723" font-size="22" font-weight="700" text-anchor="middle" fill="#1e3045">Host＋独立Sol</text>
<text x="1242" y="754" font-size="18" font-weight="400" text-anchor="middle" fill="#1e3045">再検査・内容の確認</text>
<text x="1242" y="782" font-size="17" font-weight="400" text-anchor="middle" fill="#1e3045">合格：採用／不合格：記録</text>
<rect x="40" y="868" width="1384" height="153" rx="14" fill="#f5f8fc" stroke="none" stroke-width="2"/>
<text x="60" y="905" font-size="21" font-weight="700" text-anchor="start" fill="#3565b5">今回わかった範囲</text>
<text x="280" y="905" font-size="21" font-weight="400" text-anchor="start" fill="#1e3045">条件がそろった後の、分担・実行・確認・引き継ぎを含む比較。</text>
<text x="60" y="946" font-size="21" font-weight="700" text-anchor="start" fill="#936820">まだ測っていない範囲</text>
<text x="320" y="946" font-size="21" font-weight="400" text-anchor="start" fill="#1e3045">明確化と検査準備を含む、最初から最後までの全体の費用削減。</text>
<text x="60" y="990" font-size="19" font-weight="400" text-anchor="start" fill="#536577">Host検査は内容全体の正しさを保証しない。AIの確認も正解保証ではない。準備費用の未測定分は0としない。</text>
<text x="40" y="1054" font-size="19" font-weight="700" text-anchor="start" fill="#1e3045">目標：Sol単体と同等の最終品質を目指し、全体のCreditsと正解1件あたりのCreditsを減らす。  2026-10-29</text>
</g></svg>
